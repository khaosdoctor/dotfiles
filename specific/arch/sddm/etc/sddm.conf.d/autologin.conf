# Autologin on boot only.
# Relogin=false means SDDM is skipped when the machine boots, but the greeter
# comes back with a normal password prompt on logout or user switch.
#
# The LUKS passphrase is still required before this point, so at-rest data is
# unaffected. Note that gnome-keyring/kwallet are unlocked by the login password
# via PAM, and with no password entered they will prompt on first use instead.
#
# Revert: delete this file (and the /etc/sddm.conf.d/autologin.conf symlink).
[Autologin]
User=khaosdoctor
Session=hyprland-uwsm.desktop
Relogin=false
