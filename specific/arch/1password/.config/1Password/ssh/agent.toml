# Keys the 1Password SSH agent offers, in this order. Login keys first:
# sshd gives up after ~6 attempts, so offering every key breaks logins.
# Keys not listed stay in the vault, the agent just doesn't offer them.

[[ssh-keys]]
item = "Newmann Arch ED25519"

[[ssh-keys]]
item = "Neumann RSA"

[[ssh-keys]]
item = "AUR libfprint-elan"

[[ssh-keys]]
item = "AUR OpenSynapse Key"

[[ssh-keys]]
item = "AUR Proton Drive FS Package Key"
