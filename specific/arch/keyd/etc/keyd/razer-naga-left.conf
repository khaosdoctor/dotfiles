# 12-key thumbpad sends plain 1..0 - = (verified via `keyd monitor`).
# Remapped to ctrl+<n> because most of f13..f24 arrive as XF86 symbols:
# xkb turns them into Launch#, AudioMicMute and TouchpadToggle, so Tibia
# never sees an F-key. Only f19 came through intact.
# [ids] scopes this to the mouse, so the real keyboard's ctrl+1 is untouched.
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
0 = C-0
minus = C-minus
equal = C-equal
